name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Siapkan file APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/KasirWarung-v1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: KasirWarung-apk
          path: out/*.apk
      - name: Terbitkan di halaman Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/*.apk \
            --title "Kasir Warung $TAG" \
            --notes "APK Android Kasir Warung. Unduh file .apk di bawah, buka di HP, lalu izinkan instal dari sumber ini. Versi baru bisa langsung menimpa versi lama tanpa menghapus data." \
            --latest
